    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Connected Coordination Node / Arrow Handoff Motif -->
  <path 
    d="M11 17.5 L14.5 21 L21 14.5" 
    fill="none" 
    stroke="#38bdf8" 
    stroke-width="2.2" 
    stroke-linecap="round" 
